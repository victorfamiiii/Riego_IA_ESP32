<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <style>
    .box { fill:#f3f4f6; stroke:#333; stroke-width:1; rx:6; }
    .box-iot { fill:#fff7ed; }
    .box-ia { fill:#eef2ff; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:13px; }
    .arrow { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Web layer -->
  <rect class="box" x="60" y="40" width="160" height="60" />
  <text x="140" y="75" text-anchor="middle" class="label">Usuario\nNavegador</text>

  <rect class="box" x="260" y="40" width="180" height="60" />
  <text x="350" y="75" text-anchor="middle" class="label">Reverse proxy\nNGINX / cloudflared</text>

  <rect class="box" x="480" y="20" width="160" height="60" />
  <text x="560" y="55" text-anchor="middle" class="label">Frontend\nNext.js</text>

  <rect class="box" x="480" y="110" width="160" height="60" />
  <text x="560" y="145" text-anchor="middle" class="label">Backend\nDjango / Gunicorn</text>

  <rect class="box" x="680" y="110" width="140" height="50" />
  <text x="750" y="140" text-anchor="middle" class="label">Postgres</text>

  <rect class="box" x="680" y="20" width="140" height="50" />
  <text x="750" y="50" text-anchor="middle" class="label">Firebase / FCM</text>

  <!-- IoT layer -->
  <rect class="box box-iot" x="160" y="320" width="140" height="60" />
  <text x="230" y="355" text-anchor="middle" class="label">ESP32</text>

  <rect class="box box-iot" x="360" y="300" width="200" height="70" />
  <text x="460" y="335" text-anchor="middle" class="label">MQTT Broker\nmosquitto</text>

  <rect class="box box-iot" x="600" y="320" width="200" height="60" />
  <text x="700" y="355" text-anchor="middle" class="label">mqtt_bridge\n(Django client)</text>

  <!-- IA box -->
  <rect class="box box-ia" x="60" y="200" width="220" height="70" />
  <text x="170" y="235" text-anchor="middle" class="label">Gemini Scheduler\n(Irrigation decision)</text>

  <rect class="box box-ia" x="300" y="200" width="220" height="70" />
  <text x="410" y="235" text-anchor="middle" class="label">IrrigationController\n(inicia eventos)</text>

  <!-- arrows web -->
  <path class="arrow" d="M220 70 L260 70" />
  <path class="arrow" d="M440 70 L480 50" />
  <path class="arrow" d="M480 80 L480 110" />
  <path class="arrow" d="M640 140 L680 140" />
  <path class="arrow" d="M640 45 L680 45" />

  <!-- arrows iot -->
  <path class="arrow" d="M230 380 L360 335" />
  <path class="arrow" d="M560 145 L560 300" />
  <path class="arrow" d="M560 300 L560 335" />
  <path class="arrow" d="M560 335 L600 350" />
  <path class="arrow" d="M560 350 L700 350" />
  <path class="arrow" d="M780 350 L700 350" />

  <!-- IA arrows -->
  <path class="arrow" d="M190 270 L190 320" />
  <path class="arrow" d="M420 270 L420 320" />

  <!-- labels -->
  <text x="300" y="420" class="label">telemetry: esp32/{mac}/telemetry/...</text>
  <text x="640" y="460" class="label">commands: esp32/{mac}/commands/response</text>

</svg>
