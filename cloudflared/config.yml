# Cloudflare Tunnel Configuration
tunnel: c8622c73-67ee-4ebe-8b7a-e0ad58411169
credentials-file: /etc/cloudflared/cloudflared-credentials.json

# Configuración básica
no-autoupdate: true
protocol: http2
loglevel: info
grace-period: 30s
metrics: 0.0.0.0:20241

# Configuración de ingress con keepalive
ingress:
  - hostname: riegoesp32.victorfg.work
    service: https://nginx:443
    originRequest:
      caPool: /etc/cloudflared/ssl/cloudflare-origin-ca.pem
      originServerName: riegoesp32.victorfg.work
      connectTimeout: 60s
      tcpKeepAlive: 30s
      keepAliveConnections: 100
      keepAliveTimeout: 90s
      noHappyEyeballs: false
      http2Origin: true
  - service: http_status:404
